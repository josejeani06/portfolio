<!doctype html>
<html lang="en">
<head>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){if(window.self!==window.top)return;
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xu2es8f588");
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <meta name="robots" content="noindex" />
  <title>LettrLabs Audience Builder Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <!-- Ivanlabs Design System — tokens load once, before any app CSS. -->
  <link rel="stylesheet" href="ds/tokens.css" />
  <link rel="stylesheet" href="ds/typography.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="prototype-shell" aria-label="LettrLabs audience builder prototype">
    <section class="builder-card">
      <aside class="location-panel" aria-label="Selected locations">
        <header class="panel-title">
          <h1>Select your locations in the map</h1>
          <button class="icon-help icon-button-plain" type="button" aria-label="Location helper">
            <span class="icon-wrap icon-wrap--small" aria-hidden="true"><span class="material-symbols-rounded">help</span></span>
          </button>
          <button id="closeLocationPanel" class="location-panel-close icon-button-plain" type="button" aria-label="Close locations panel">
            <span class="icon-wrap icon-wrap--small" aria-hidden="true"><span class="material-symbols-rounded">close</span></span>
          </button>
        </header>

        <!-- Hosts. Everything below this line is rendered by the design system
             (see ds-mount.js); the markup only reserves the position. -->
        <div class="search-wrap">
          <div id="searchField"></div>
          <div id="searchMenu" class="search-menu" hidden></div>
        </div>

        <div id="emptyState" class="empty-state"></div>

        <div id="selectedState" class="selected-state" hidden>
          <div id="selectedSummary" class="selected-summary"></div>
          <div id="selectedList" class="selected-list"></div>
          <div id="bulkBar" class="bulk-bar" hidden>
            <strong><span id="bulkCount">0</span> / 24 selected.</strong>
            <button type="button">Select All</button>
            <button type="button">Actions<span class="icon-wrap icon-wrap--small" aria-hidden="true"><span class="material-symbols-rounded">keyboard_arrow_down</span></span></button>
          </div>
        </div>
      </aside>

      <section class="map-pane" aria-label="Map">
        <div id="mapCanvas" class="map-canvas">
          <div id="leafletMap" class="leaflet-map" aria-label="Map of the United States"></div>
          <button id="locationPanelToggle" class="location-panel-toggle" type="button"><span class="icon-wrap icon-wrap--small" aria-hidden="true"><span class="material-symbols-rounded">menu</span></span>Locations</button>

          <div class="top-map-actions">
            <div id="mapOptionsHost" class="map-options"></div>
            <button id="addMapButton" class="secondary-map-action" type="button" hidden><span class="icon-wrap icon-wrap--small" aria-hidden="true"><span class="material-symbols-rounded">swap_horiz</span></span><span class="active-map-name">Add Map</span></button>
          </div>

          <div id="drawActions" class="draw-actions"></div>
          <div id="drawActionsMobile" class="draw-actions-mobile"></div>

          <div id="drawModeActions" class="draw-mode-actions" hidden></div>

          <div id="boundaryLoading" class="boundary-loading" hidden role="status" aria-live="polite"></div>

          <div id="zoomControl" class="zoom-control" aria-label="Zoom controls"></div>

          <div class="street-view" aria-hidden="true"></div>

          <div class="map-footer">
            <div id="viewToggle" class="view-toggle" role="group" aria-label="Map view"></div>
            <div class="footer-actions">
              <div class="area-select-wrap">
                <div id="areaSelect" class="area-select"></div>
                <div id="areaMenu" class="area-menu" hidden></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- Ivanlabs Design System 0.4.1 — the real components. `_ds_bundle.js` is the
       package's own IIFE build (React external), so window.IVDS carries every
       component. Vendored, not CDN, so the prototype never depends on a network. -->
  <script src="ds/react.js"></script>
  <script src="ds/react-dom.js"></script>
  <script src="ds/ivanlabs-design-system.js"></script>
  <script src="ds-mount.js"></script>
  <script src="script.js?v=boundary-city-zip-7"></script>
  <script src="demo.js"></script>
</body>
</html>
