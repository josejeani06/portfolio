<!doctype html>
<html lang="en">
<head>
  <script type="text/javascript">

      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xu2es8f588");
  </script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<meta name="robots" content="noindex" />
<title>Ivanlabs Design System — Token Layers</title>

<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/tokens.css" />
<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/typography.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

<style>
  :root { --ink: 24 26 42; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: transparent;
    font-family: var(--font-family-body);
    padding: 28px;
    display: flex;
    justify-content: center;
  }

  /* ONE container card holds the whole composition */
  .frame {
    width: 100%;
    max-width: 1040px;
    background: var(--neutral-bg-default);
    border: 1px solid var(--neutral-border-muted);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgb(var(--ink) / .05), 0 6px 16px rgb(var(--ink) / .05);
    padding: 40px 44px;
    animation: frameIn .6s ease both;
  }
  @keyframes frameIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .frame { animation: none; } }

  /* section eyebrow */
  .eyebrow {
    font: var(--text-label);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--neutral-text-icon-emphasis);
    font-weight: 700;
  }

  .hr { height: 1px; background: var(--neutral-border-muted); border: 0; margin: 0; }

  /* three-layer row */
  .layers { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .layer { padding: 26px 30px 4px; }
  .layer + .layer { border-left: 1px solid var(--neutral-border-muted); }
  .layer__tag {
    font: var(--text-label);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--error-text-icon-default);
    font-weight: 700;
    margin: 0 0 16px;
  }
  .layer__swatch {
    width: 66px; height: 66px; border-radius: 16px;
    border: 1px solid rgb(var(--ink) / .06);
    margin-bottom: 22px;
  }
  .layer__code {
    font-family: var(--font-family-mono, ui-monospace, monospace);
    font-size: 20px; font-weight: 700;
    color: var(--neutral-text-icon-strong);
    margin: 0 0 10px;
  }
  .layer__desc {
    font: var(--text-body);
    color: var(--neutral-text-icon-emphasis);
    margin: 0;
  }

  /* families table */
  .table-wrap { overflow-x: auto; }
  table.tokens { width: 100%; border-collapse: collapse; }
  table.tokens th, table.tokens td { text-align: left; padding: 16px 12px; vertical-align: middle; }
  table.tokens thead th {
    font: var(--text-label);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--neutral-text-icon-emphasis);
    font-weight: 700;
    border-bottom: 1px solid var(--neutral-border-muted);
    padding-bottom: 14px;
  }
  table.tokens tbody tr { border-bottom: 1px solid var(--neutral-border-muted); transition: background .15s ease; }
  table.tokens tbody tr:hover { background: var(--neutral-bg-subtle); }
  .fam {
    font-size: 18px; font-weight: 700;
    color: var(--neutral-text-icon-strong);
    white-space: nowrap;
    padding-right: 24px;
  }
  .cell { display: flex; align-items: center; gap: 14px; }
  .cell__swatch {
    width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto;
    border: 1px solid rgb(var(--ink) / .12);
  }
  .cell__code {
    font-family: var(--font-family-mono, ui-monospace, monospace);
    font-size: 15px;
    color: var(--neutral-text-icon-strong);
    white-space: nowrap;
  }

  @media (max-width: 820px) {
    .layers { grid-template-columns: 1fr; }
    .layer + .layer { border-left: 0; border-top: 1px solid var(--neutral-border-muted); }
    .frame { padding: 28px; }
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .frame { padding: 24px 18px; border-radius: 12px; }
    .table-wrap { overflow: visible; }
    table.tokens, table.tokens tbody { display: block; width: 100%; }
    table.tokens thead { display: none; }
    table.tokens tbody tr {
      display: grid;
      gap: 8px;
      padding: 16px 0;
    }
    table.tokens th, table.tokens td { display: block; padding: 0; }
    .fam { padding: 0 0 4px; font-size: 17px; }
    table.tokens td:not(.fam) {
      display: grid;
      grid-template-columns: 66px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    table.tokens td:not(.fam)::before {
      content: attr(data-label);
      font: var(--text-label);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--neutral-text-icon-emphasis);
      font-weight: 700;
      font-size: 10px;
    }
    .cell { min-width: 0; gap: 10px; }
    .cell__swatch { width: 24px; height: 24px; border-radius: 6px; }
    .cell__code { min-width: 0; white-space: normal; overflow-wrap: anywhere; font-size: 13px; line-height: 1.35; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="importmap">
  { "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "htm": "https://esm.sh/htm@3.1.1",
      "@ivancreatelabs/design-system": "https://esm.sh/@ivancreatelabs/design-system@0.4.0?external=react,react-dom"
  } }
  </script>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';
    import * as DS from '@ivancreatelabs/design-system';

    const html = htm.bind(React.createElement);
    const { Button } = DS;

    const sw = (token) => ({ background: `var(${token})` });

    /* the six token families × three roles */
    const FAMILIES = [
      { name: 'Brand',   bg: '--brand-bg-default',   border: '--brand-border-default',   text: '--brand-text-icon-default' },
      { name: 'Neutral', bg: '--neutral-bg-default', border: '--neutral-border-default', text: '--neutral-text-icon-default' },
      { name: 'Info',    bg: '--info-bg-default',    border: '--info-border-default',    text: '--info-text-icon-default' },
      { name: 'Success', bg: '--success-bg-default', border: '--success-border-default', text: '--success-text-icon-default' },
      { name: 'Warning', bg: '--warning-bg-default', border: '--warning-border-default', text: '--warning-text-icon-default' },
      { name: 'Error',   bg: '--error-bg-default',   border: '--error-border-default',   text: '--error-text-icon-default' },
    ];

    function Cell({ token }) {
      return html`<div class="cell">
        <div class="cell__swatch" style=${sw(token)}></div>
        <span class="cell__code">${token}</span>
      </div>`;
    }

    function App() {
      return html`<div class="frame" data-embed-content>
        <!-- ONE VALUE, THREE LAYERS -->
        <div class="eyebrow" style=${{ marginBottom: 4, display: 'block' }}>One value, three layers</div>
        <hr class="hr" style=${{ marginTop: 18 }} />

        <div class="layers">
          <div class="layer">
            <p class="layer__tag">Layer 01</p>
            <div class="layer__swatch" style=${sw('--purple-300')}></div>
            <p class="layer__code">--purple-300</p>
            <p class="layer__desc">the raw value. no meaning yet.</p>
          </div>

          <div class="layer">
            <p class="layer__tag">Layer 02</p>
            <div class="layer__swatch" style=${sw('--brand-bg-default')}></div>
            <p class="layer__code">--brand-bg-default</p>
            <p class="layer__desc">points at the primitive. this is what a screen uses.</p>
          </div>

          <div class="layer">
            <p class="layer__tag">Layer 03</p>
            <div style=${{ marginBottom: 22 }}>
              <${Button} kind="primary" label="Get started" />
            </div>
            <p class="layer__code">Button kind="primary"</p>
            <p class="layer__desc">consumes the semantic token. never the raw value.</p>
          </div>
        </div>

        <!-- SIX FAMILIES × THREE ROLES -->
        <div class="eyebrow" style=${{ marginTop: 46, marginBottom: 18, display: 'block' }}>
          Six families × three roles — every fill has a matching, contrast-safe foreground
        </div>

        <div class="table-wrap">
          <table class="tokens">
            <thead>
              <tr>
                <th></th>
                <th>Bg</th>
                <th>Border</th>
                <th>Text-icon</th>
              </tr>
            </thead>
            <tbody>
              ${FAMILIES.map(f => html`<tr key=${f.name}>
                <td class="fam">${f.name}</td>
                <td data-label="Bg"><${Cell} token=${f.bg} /></td>
                <td data-label="Border"><${Cell} token=${f.border} /></td>
                <td data-label="Text / icon"><${Cell} token=${f.text} /></td>
              </tr>`)}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);

    // Report the settled React layout to the parent case study. This is required when the
    // embedding browser isolates iframe documents and the parent cannot read scrollHeight.
    const reportHeight = () => {
      const content = document.querySelector('[data-embed-content]');
      const bodyStyle = getComputedStyle(document.body);
      const verticalInset = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
      const height = content
        ? Math.ceil(content.getBoundingClientRect().height + verticalInset)
        : Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      window.parent.postMessage({ type: 'ivds-recreation-resize', height }, '*');
    };
    new ResizeObserver(reportHeight).observe(document.body);
    window.addEventListener('load', reportHeight);
    if (document.fonts?.ready) document.fonts.ready.then(reportHeight);
    requestAnimationFrame(reportHeight);
  </script>
</body>
</html>
