<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<meta name="robots" content="noindex" />
<title>Ivanlabs Design System — Compose Campaign</title>

<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/tokens.css" />
<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/typography.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

<style>
  :root { --ink: 24 26 42; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: transparent;               /* no page bg, no dot grid */
    font-family: var(--font-family-body);
    padding: 28px;
    display: flex;
    justify-content: center;
  }

  /* ONE container card holds the whole composition */
  .frame {
    width: 100%;
    max-width: 1120px;
    background: var(--neutral-bg-default);
    border: 1px solid var(--neutral-border-muted);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgb(var(--ink) / .05), 0 6px 16px rgb(var(--ink) / .05);
    padding: 34px 38px;
    animation: frameIn .6s ease both;
  }
  @keyframes frameIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .frame { animation: none; } }

  .grid { display: grid; grid-template-columns: 1.12fr 1fr; gap: 42px; align-items: start; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; gap: 30px; } .frame { padding: 24px; } }

  .col { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; }
  .muted { color: var(--neutral-text-icon-emphasis); }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  /* group label above a field */
  .glabel { font: var(--text-label); color: var(--neutral-text-icon-strong); margin-bottom: 8px; display: block; }

  /* toggle setting rows */
  .setrow { display: flex; align-items: center; gap: 20px; padding: 18px 2px; }
  .setrow__t { font: var(--text-title); color: var(--neutral-text-icon-strong); }
  .setrow__d { font: var(--text-body-sm); color: var(--neutral-text-icon-emphasis); margin-top: 3px; }
  .hr { height: 1px; background: var(--neutral-border-muted); border: 0; margin: 0; }

  /* composed inline dialog (matches screenshot — light header, not a scrim overlay) */
  .dlg { border: 1px solid var(--neutral-border-muted); border-radius: 16px; background: var(--neutral-bg-default);
         box-shadow: 0 1px 2px rgb(var(--ink) / .05), 0 10px 28px rgb(var(--ink) / .10); overflow: hidden; }
  .dlg__bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; }
  .dlg__title { font: var(--text-h3); color: var(--neutral-text-icon-strong); }
  .dlg__x { display: grid; place-items: center; color: var(--neutral-text-icon-emphasis); cursor: pointer;
            background: none; border: 0; padding: 4px; border-radius: 8px; }
  .dlg__x:hover { background: var(--neutral-bg-subtle); }
  .dlg__body { padding: 20px 22px; font: var(--text-body); color: var(--neutral-text-icon-default); }
  .dlg__foot { display: flex; justify-content: flex-end; gap: 12px; padding: 4px 22px 22px; }

  .side { display: flex; flex-direction: column; gap: 20px; }

  /* let DS fields fill the column */
  .frame .ivdsField { width: 100%; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="importmap">
  { "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "htm": "https://esm.sh/htm@3.1.1",
      "@ivancreatelabs/design-system": "https://esm.sh/@ivancreatelabs/design-system@0.4.0?external=react,react-dom"
  } }
  </script>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';
    import * as DS from '@ivancreatelabs/design-system';

    const html = htm.bind(React.createElement);
    const {
      InputField, SelectField, DateField, NumberField, TextArea,
      Toggle, Banner, Button, Toast, Empty, Icon
    } = DS;

    const I = (name, props = {}) => html`<${Icon} name=${name} ...${props} />`;
    const fullw = { width: '100%', maxWidth: 'none' };   // fields cap at a maxWidth by default — clear it

    /* a labelled toggle setting row */
    function SettingRow({ title, desc, on }) {
      const [checked, setChecked] = React.useState(!!on);
      return html`<div class="setrow">
        <div class="col" style=${{ flex: 1 }}>
          <span class="setrow__t">${title}</span>
          <span class="setrow__d">${desc}</span>
        </div>
        <${Toggle} checked=${checked} onChange=${e => setChecked(e && e.target ? e.target.checked : !checked)} />
      </div>`;
    }

    /* the compose form (left column) */
    function ComposeForm() {
      const [name, setName] = React.useState('');
      const [notes, setNotes] = React.useState('');
      const templateOpts = [
        { value: 'postcard', label: 'Postcard — 6×9' },
        { value: 'letter', label: 'Letter in envelope' },
        { value: 'handwritten', label: 'Handwritten note' },
        { value: 'flyer', label: 'Folded flyer' },
      ];
      const audienceOpts = [
        { value: 'storm-dallas', label: 'Storm — Dallas' },
        { value: 'storm-austin', label: 'Storm — Austin' },
        { value: 'lapsed', label: 'Lapsed customers' },
        { value: 'csv', label: 'Uploaded CSV — March' },
      ];
      return html`<div class="col" style=${{ gap: 20 }}>
        <div class="col" style=${{ gap: 4 }}>
          <span style=${{ font: 'var(--text-h2)', color: 'var(--neutral-text-icon-strong)' }}>New campaign</span>
          <span class="muted" style=${{ font: 'var(--text-body)' }}>Set the audience, the creative, and when it goes out.</span>
        </div>

        <${InputField} label="Campaign name" placeholder="Spring roof check-in" value=${name}
          onChange=${e => setName(e.target.value)} style=${fullw} />

        <div class="field-grid">
          <${SelectField} label="Template" placeholder="Select a template" options=${templateOpts} style=${fullw} />
          <${DateField} label="Send date" style=${fullw} />
        </div>

        <div class="field-grid">
          <${NumberField} label="Budget" defaultValue=${0} min="0" style=${fullw} />
          <${SelectField} label="Audience" defaultValue="storm-dallas" options=${audienceOpts} style=${fullw} />
        </div>

        <${TextArea} label="Internal notes" placeholder="Notes for your team — not printed on the mail piece."
          rows=${4} value=${notes} onChange=${e => setNotes(e.target.value)} style=${fullw} />

        <${Banner} color="warning" title="Holdout testing is enabled"
          message="You can still continue, but your budget may need to be higher for reliable measurement." />

        <div class="col">
          <${SettingRow} on=${true} title="Send in batches"
            desc="Spread delivery across five days instead of all at once." />
          <hr class="hr" />
          <${SettingRow} on=${true} title="Track responses"
            desc="Attribute inbound calls and form fills back to this campaign." />
          <hr class="hr" />
          <${SettingRow} on=${false} title="Require approval"
            desc="A second admin signs off before anything mails." />
          <hr class="hr" />
        </div>

        <div class="row" style=${{ justifyContent: 'flex-end', gap: 12, paddingTop: 2 }}>
          <${Button} kind="secondary" label="Save draft" />
          <${Button} kind="primary" label="Schedule campaign" icon="send" />
        </div>
      </div>`;
    }

    /* inline discard dialog (composed to sit in the column, per the screenshot) */
    function DiscardDialog({ onClose }) {
      return html`<div class="dlg">
        <div class="dlg__bar">
          <span class="dlg__title">Discard this campaign?</span>
          <button class="dlg__x" onClick=${onClose} aria-label="Close">${I('close', { size: 'small' })}</button>
        </div>
        <hr class="hr" />
        <div class="dlg__body">Nothing has been sent yet. Discarding removes the draft and its audience selection.</div>
        <div class="dlg__foot">
          <${Button} kind="secondary" label="Keep editing" onClick=${onClose} />
          <${Button} kind="primary" label="Discard" />
        </div>
      </div>`;
    }

    function App() {
      const [showDialog, setShowDialog] = React.useState(true);
      const [showToast, setShowToast] = React.useState(true);
      return html`<div class="frame">
        <div class="grid">
          <${ComposeForm} />
          <div class="side">
            ${showDialog && html`<${DiscardDialog} onClose=${() => setShowDialog(false)} />`}
            <${Banner} color="error" title="A template is required" message="Select a template to continue." />
            ${showToast && html`<${Toast} color="brand" title="Draft saved"
              subtitle="You can pick this up later from Campaigns." style=${{ width: '100%' }} />`}
            <${Empty} icon="inbox" title="No audiences yet"
              description="Build one from a search, a saved area, or a CSV." style=${{ maxWidth: 'none' }} />
          </div>
        </div>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
