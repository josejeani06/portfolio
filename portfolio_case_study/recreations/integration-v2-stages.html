<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<meta name="robots" content="noindex" />
<title>Ivanlabs Design System — Confirm your stages</title>

<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/tokens.css" />
<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/typography.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

<style>
  :root { --ink: 24 26 42; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: transparent;               /* no page bg */
    font-family: var(--font-family-body);
    padding: 28px;                          /* hugs content height */
  }

  /* ONE container card holds the whole dialog */
  .frame {
    width: 100%;
    margin: 0 auto;
    max-width: 900px;
    background: var(--neutral-bg-default);
    border: 1px solid var(--neutral-border-muted);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgb(var(--ink) / .05), 0 6px 16px rgb(var(--ink) / .05);
    overflow: hidden;
    animation: frameIn .6s ease both;
  }
  @keyframes frameIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .frame { animation: none; } }

  /* brand header bar, full-bleed to the card edges */
  .hbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
    background: var(--brand-bg-default);
  }
  .hbar__title { font: var(--text-h3); color: var(--brand-text-icon-on-brand, #fff); }
  .hbar__x {
    display: grid; place-items: center; cursor: pointer;
    background: none; border: 0; padding: 4px; border-radius: 8px;
    color: var(--brand-text-icon-on-brand, #fff);
  }
  .hbar__x:hover { background: rgb(255 255 255 / .16); }

  .body { padding: 22px 24px 24px; }

  /* pipeline heading */
  .pipe { display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
  .pipe__name { display: flex; align-items: center; gap: 8px; font: var(--text-h4); color: var(--neutral-text-icon-strong); }
  .pipe__name .material-symbols-rounded { font-size: 20px; color: var(--neutral-text-icon-emphasis); }
  .pipe__sub { font: var(--text-body-sm); color: var(--neutral-text-icon-emphasis); }

  /* mapping grid columns: stage name + three mapping columns */
  .grid-cols { display: grid; grid-template-columns: minmax(220px, 1fr) 150px 150px 150px; align-items: center; }

  /* column header row */
  .colhead { padding: 6px 0 10px; }
  .colhead__c { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .colhead__label { font: var(--text-label); color: var(--brand-text-icon-default); }
  .colhead__help { display: inline-grid; place-items: center; color: var(--neutral-text-icon-muted); cursor: help; }
  .colhead__help .material-symbols-rounded { font-size: 16px; }

  /* a mapping row pill */
  .row-pill {
    border: 1px solid var(--neutral-border-muted); border-radius: 12px;
    background: var(--neutral-bg-default); margin-bottom: 12px; min-height: 52px;
  }
  .row-pill.is-head { background: var(--neutral-bg-subtle); }
  .cell-name { padding: 0 20px; font: var(--text-body); color: var(--neutral-text-icon-strong); }
  .cell-name.is-head { font: var(--text-label); color: var(--brand-text-icon-default); }
  .cell-check { display: flex; align-items: center; justify-content: center; padding: 14px 0; }

  /* footer */
  .foot { display: flex; justify-content: flex-end; margin-top: 22px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="importmap">
  { "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "htm": "https://esm.sh/htm@3.1.1",
      "@ivancreatelabs/design-system": "https://esm.sh/@ivancreatelabs/design-system@0.4.0?external=react,react-dom"
  } }
  </script>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';
    import * as DS from '@ivancreatelabs/design-system';

    const html = htm.bind(React.createElement);
    const { Checkbox, Banner, Button, Icon } = DS;

    const COLUMNS = [
      { key: 'lead', label: 'Lead' },
      { key: 'conversion', label: 'Conversion' },
      { key: 'complete', label: 'Job Complete' },
    ];

    const STAGES = ['New Lead', 'Job Booked', 'In Progress', 'Job Won', 'Job Completed'];

    // initial mapping matrix: stage -> {lead, conversion, complete}
    const INITIAL = {
      'New Lead':      { lead: false, conversion: false, complete: false },
      'Job Booked':    { lead: true,  conversion: false, complete: true  },
      'In Progress':   { lead: false, conversion: false, complete: false },
      'Job Won':       { lead: true,  conversion: false, complete: false },
      'Job Completed': { lead: false, conversion: false, complete: true  },
    };

    function ColHeader({ label }) {
      return html`<div class="colhead__c">
        <span class="colhead__label">${label}</span>
        <span class="colhead__help" title=${'Map stages to ' + label}>
          <span class="material-symbols-rounded">help</span>
        </span>
      </div>`;
    }

    function App() {
      const [map, setMap] = React.useState(INITIAL);

      const setCell = (stage, col, next) =>
        setMap(m => ({ ...m, [stage]: { ...m[stage], [col]: next } }));

      // set entire column
      const setColumn = (col, next) =>
        setMap(m => {
          const out = {};
          for (const s of STAGES) out[s] = { ...m[s], [col]: next };
          return out;
        });

      const columnCount = (col) => STAGES.reduce((n, s) => n + (map[s][col] ? 1 : 0), 0);

      const conversionCount = columnCount('conversion');

      return html`<div class="frame">
        <div class="hbar">
          <span class="hbar__title">Setup your stages</span>
          <button class="hbar__x" aria-label="Close">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>

        <div class="body">
          <div class="pipe">
            <span class="pipe__name">
              <span class="material-symbols-rounded">database</span>
              Pipeline 1
            </span>
            <span class="pipe__sub">Confirm your stages</span>
          </div>

          <!-- column headers -->
          <div class="grid-cols colhead">
            <div></div>
            ${COLUMNS.map(c => html`<${ColHeader} key=${c.key} label=${c.label} />`)}
          </div>

          <!-- select-all header row -->
          <div class="grid-cols row-pill is-head">
            <div class="cell-name is-head">Items</div>
            ${COLUMNS.map(c => {
              const count = columnCount(c.key);
              const all = count === STAGES.length;
              const some = count > 0 && !all;
              return html`<div class="cell-check" key=${c.key}>
                <${Checkbox}
                  checked=${all}
                  indeterminate=${some}
                  onChange=${(next) => setColumn(c.key, !!next)}
                />
              </div>`;
            })}
          </div>

          <!-- stage rows -->
          ${STAGES.map(stage => html`<div class="grid-cols row-pill" key=${stage}>
            <div class="cell-name">${stage}</div>
            ${COLUMNS.map(c => html`<div class="cell-check" key=${c.key}>
              <${Checkbox}
                checked=${map[stage][c.key]}
                onChange=${(next) => setCell(stage, c.key, !!next)}
              />
            </div>`)}
          </div>`)}

          ${conversionCount === 0 && html`<${Banner}
            color="warning"
            title="No conversions will be attributed"
            message="Map at least one stage to Conversion, or none will be attributed."
            style=${{ marginTop: 8 }}
          />`}

          <div class="foot">
            <${Button} kind="primary" label="Save" />
          </div>
        </div>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
