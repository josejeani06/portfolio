<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ivanlabs Design System — Connect Integration Flow</title>

<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/tokens.css" />
<link rel="stylesheet" href="https://unpkg.com/@ivancreatelabs/design-system@0.4.0/dist/typography.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

<style>
  :root { --ink: 24 26 42; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: transparent; font-family: var(--font-family-body); padding: 28px; }

  .frame {
    width: 100%; max-width: 760px; margin: 0 auto;
    /* bg-gradient-weak — the DS linear gradient at 10% over white */
    background: linear-gradient(135deg, rgba(85,81,255,.10) 0%, rgba(165,163,254,.10) 100%), #ffffff;
    border: 1px solid var(--neutral-border-muted);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgb(var(--ink) / .05), 0 8px 24px rgb(var(--ink) / .06);
    padding: 34px 40px 30px;
    animation: frameIn .55s ease both;
  }
  @keyframes frameIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* the animation frame is a positioned wrapper so the scripted cursor can sit
     absolutely on top of the live components */
  .animwrap { position: relative; }

  /* 3 states crossfade in place; fixed height keeps the frame stable */
  .flowstage { position: relative; height: 780px; }
  .flowlayer { position: absolute; inset: 0; opacity: 0; transform: translateY(8px);
               transition: opacity .4s ease, transform .4s ease; pointer-events: none;
               display: flex; flex-direction: column; }
  .flowlayer.on { opacity: 1; transform: none; pointer-events: auto; }
  .flowlayer--center { justify-content: center; align-items: center; text-align: center; }

  .mock { font-family: var(--font-family-body); color: var(--neutral-text-icon-strong); width: 100%; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .muted { color: var(--neutral-text-icon-emphasis); }
  .card2 { border: 1px solid var(--neutral-border-default); border-radius: 16px; padding: 22px 24px; background: var(--neutral-bg-default); }

  /* ===== glass tile: a positioned wrapper with the glass SVG and the logo as
     two ABSOLUTE layers, so the logo sits on the tile's exact centre ===== */
  .tiles { display: flex; align-items: center; justify-content: center; gap: 0; }
  .tile { position: relative; z-index: 1; width: 116px; height: 116px; flex: none; }
  .tile__glass { position: absolute; inset: 0; }
  .tile__glass svg { width: 100%; height: 100%; display: block; }
  .tile__logo { position: absolute; inset: 0; display: grid; place-items: center; }
  .tile__logo svg { width: 46%; height: 46%; display: block; }

  /* scene-1 connector — paired arrows (arrow-wrapper.svg, 93×180) */
  .arrows { width: 120px; display: flex; align-items: center; justify-content: center; flex: none; }
  .arrows svg { height: 116px; width: auto; display: block; }

  /* scenes 2 & 3 connector — two dots + line (connector.svg 136×56). Negative
     margins overlap the tiles so each end dot sits on the glass edge. */
  .arrows { margin: 0 6px; }
  .connector { position: relative; z-index: 2; width: 150px; margin: 0 -31px; display: flex; align-items: center; justify-content: center; flex: none; }
  .connector svg { width: 150px; height: auto; display: block; }

  /* pulsating ellipses behind the tiles while connecting — three sizes, three
     intervals, so at any moment they read as an expanding pulse */
  .pulsewrap { position: relative; display: flex; align-items: center; justify-content: center; }
  /* the pulse sits at the BOTTOM layer — three real 1:1 circles (Ellipse 1.svg),
     varying size + opacity, gently pulsating on offset timing */
  .pulsewrap .ring { position: absolute; left: 50%; top: 50%; z-index: 0; pointer-events: none; transform: translate(-50%,-50%); }
  .pulsewrap .ring svg { width: 100%; height: 100%; display: block; }
  .pulsewrap .r1 { width: 320px; height: 320px; opacity: 1;   animation: pulseC 2.6s ease-in-out infinite; }
  .pulsewrap .r2 { width: 440px; height: 440px; opacity: .7;  animation: pulseC 3.3s ease-in-out .5s infinite; }
  .pulsewrap .r3 { width: 560px; height: 560px; opacity: .45; animation: pulseC 4s ease-in-out 1s infinite; }
  @keyframes pulseC { 0%, 100% { transform: translate(-50%,-50%) scale(.9); } 50% { transform: translate(-50%,-50%) scale(1.08); } }
  .pulsewrap .tiles { position: relative; z-index: 1; }

  .connecting-label { margin-top: 26px; font: var(--text-h3); font-weight: 700; color: var(--brand-text-icon-default); }

  .scene-title { font: var(--text-h1); color: var(--neutral-text-icon-strong); }
  .scene-sub { margin-top: 8px; color: var(--neutral-text-icon-emphasis); font: var(--text-body-lg); max-width: 560px; }

  .lede-title { font: var(--text-h1); text-align: center; }
  .lede-sub { margin: 10px auto 0; color: var(--neutral-text-icon-emphasis); font: var(--text-body-lg); max-width: 620px; text-align: center; line-height: 1.5; }

  .fieldhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .lbl { font: var(--text-subtitle); color: var(--neutral-text-icon-strong); }
  .helper { margin-top: 6px; font: var(--text-body-sm); color: var(--neutral-text-icon-emphasis); }
  .helper .link, .link { color: var(--brand-text-icon-default); text-decoration: underline; }

  .mock .ivdsField { width: 100%; }
  /* typed values read in neutral emphasis, distinct from the gray placeholder */
  .card2 input { color: var(--neutral-text-icon-emphasis) !important; -webkit-text-fill-color: var(--neutral-text-icon-emphasis); }
  /* the field being typed into shows the DS brand (focused) border */
  .card2 .ivdsField:focus-within { border-color: var(--brand-border-strong) !important; box-shadow: var(--focus-ring) !important; }

  .flowdots { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .flowdot { width: 8px; height: 8px; border-radius: 99px; background: var(--neutral-border-strong); transition: .3s; }
  .flowdot.on { background: var(--brand-bg-default); width: 22px; }

  /* scripted cursor */
  .cursor { position: absolute; left: 0; top: 0; z-index: 40; width: 26px; height: 32px;
    pointer-events: none; transform: translate(300px, 700px); opacity: 0;
    transition: transform .55s cubic-bezier(.35,.02,.2,1), opacity .3s ease; will-change: transform; }
  .cursor.show { opacity: 1; }
  .cursor svg { display: block; filter: drop-shadow(0 3px 6px rgba(20,20,45,.4)); transition: transform .1s ease; }
  .cursor.down svg { transform: scale(.85); }
  .cping { position: absolute; z-index: 39; width: 24px; height: 24px; margin: -12px 0 0 -12px;
    border-radius: 50%; border: 2px solid rgba(85,81,255,.6); pointer-events: none;
    animation: cping .5s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes cping { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { .frame { animation: none; } .flowlayer, .cursor { transition: none; } .pulsewrap .ring { animation: none; } }
</style>

      const tiles = html`<div class="tiles"><${Tile} logo=${LOGO_HOUSECALL} />${mid}<${Tile} logo=${LOGO_LETTRLABS} /></div>`;
      if (mode !== 'busy') return tiles;
      return html`<div class="pulsewrap"><span class="ring r1" ...${raw(CIRCLE)}></span><span class="ring r2" ...${raw(CIRCLE)}></span><span class="ring r3" ...${raw(CIRCLE)}></span>${tiles}</div>`;
    }

    const FieldHead = ({ label }) => html`<div class="fieldhead"><span class="lbl">${label}</span>${I('help', { color: 'var(--neutral-text-icon-muted)', size: 'small' })}</div>`;

    // STATE 1 — connect form
    function ScreenConnect() {
      return html`<div class="mock col" style=${{ gap: 20 }}>
        <${Tiles} mode="idle" />
        <div class="col" style=${{ gap: 4, alignItems: 'center' }}>
          <div class="lede-title">Connect Housecall Pro to Lettrlabs</div>
          <div class="lede-sub">Connect your Housecall Pro to map your CRM data to the Lettrlabs attribution pipeline. We'll discover your objects and fields automatically.</div>
        </div>
        <div class="card2 col" style=${{ gap: 16 }}>
          <div class="col" style=${{ gap: 2 }}>
            <div style=${{ font: 'var(--text-h3)' }}>Create new Connection</div>
            <div class="muted" style=${{ font: 'var(--text-body)' }}>Add your Client ID and Client Secret to Connect your Housecall Pro Account</div>
          </div>
          <div><${FieldHead} label="Connection Name" /><${InputField} label="" placeholder="e.g. Housecall Pro — Production" style=${fullw} /></div>
          <div><${FieldHead} label="Client ID" /><${InputField} label="" placeholder="Paste your Housecall Pro Client ID" style=${fullw} />
            <div class="helper">Enter your Housecall Pro developer application's <span class="link">Client ID</span></div></div>
          <div><${FieldHead} label="Client Secret" /><${InputField} label="" placeholder="Paste your Housecall Pro Client Secret" style=${fullw} />
            <div class="helper">Enter your Housecall Pro developer application's <span class="link">Client secret</span></div></div>
        </div>
        <div class="row" style=${{ justifyContent: 'center', marginTop: 4 }}>
          <${Button} kind="primary" label="Test and Continue" icon="login" onClick=${() => window.__advance && window.__advance()} /></div>
      </div>`;
    }

    // STATE 2 — connecting (pulse)
    function ScreenConnecting() {
      return html`<div class="mock col" style=${{ alignItems: 'center', justifyContent: 'center', height: '100%' }}>
        <${Tiles} mode="busy" />
        <div class="connecting-label">Connecting…</div>
      </div>`;
    }

    // STATE 3 — connected
    function ScreenConnected() {
      return html`<div class="mock col" style=${{ gap: 22, alignItems: 'center', justifyContent: 'center', height: '100%' }}>
        <${Tiles} mode="done" />
        <div class="col" style=${{ gap: 8, alignItems: 'center' }}>
          <div class="scene-title">You're connected — now let's finish setup</div>
          <div class="scene-sub" style=${{ textAlign: 'center' }}>Your Housecall Pro Integration is ready! You can still customize it further.</div>
        </div>
        <div class="row" style=${{ justifyContent: 'center' }}>
          <${Button} kind="primary" label="Customize Attribution" icon="settings" /></div>
      </div>`;
    }

    const stateFor = (p) => (p < 0.34 ? 0 : p < 0.7 ? 1 : 2);
    const hashP = () => { const h = parseFloat((location.hash || '').replace('#', '')); return isNaN(h) ? 0 : Math.max(0, Math.min(1, h)); };

    function App() {
      const [p, setP] = React.useState(hashP);
      React.useEffect(() => {
        let typingRun = 0;
        const stopTyping = () => { typingRun += 1; };
        const playTyping = () => {
          const run = ++typingRun;
          setP(0);
          const values = ['Housecall Pro — Production', 'hcp_9f3a-b21c-4d9e-a077', 'sk_live_9f2c7a41d0b8e6a3'];
          const begin = () => {
            if (run !== typingRun) return;
            const inputs = document.querySelectorAll('.card2 input');
            if (inputs.length < 3) { window.setTimeout(begin, 80); return; }
            const typeField = (fieldIndex, charIndex = 0) => {
              if (run !== typingRun || fieldIndex >= inputs.length) return;
              const input = inputs[fieldIndex];
              const value = values[fieldIndex];
              if (charIndex === 0) {
                input.value = '';
                input.dispatchEvent(new Event('input', { bubbles: true }));
                try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
              }
              if (charIndex >= value.length) {
                window.setTimeout(() => typeField(fieldIndex + 1), 130);
                return;
              }
              input.value += value[charIndex];
              input.dispatchEvent(new Event('input', { bubbles: true }));
              window.setTimeout(() => typeField(fieldIndex, charIndex + 1), 28);
            };
            typeField(0);
          };
          window.setTimeout(begin, 120);
        };
        window.__setFlow = (v) => setP(Math.max(0, Math.min(1, Number(v) || 0)));
        window.__playFlowTyping = playTyping;
        window.__stopFlowTyping = stopTyping;
        const onHash = () => setP(hashP());
        const onMessage = (event) => {
          const message = event.data;
          if (!message) return;
          if (message.type === 'portfolio:play-flow-typing') { playTyping(); return; }
          if (message.type === 'portfolio:stop-flow-typing') { stopTyping(); return; }
          if (message.type === 'portfolio:set-flow') setP(Math.max(0, Math.min(1, Number(message.state) || 0)));
        };
        window.addEventListener('hashchange', onHash);
        window.addEventListener('message', onMessage);
        return () => {
          window.removeEventListener('hashchange', onHash);
          window.removeEventListener('message', onMessage);
          try {
            delete window.__setFlow;
            delete window.__playFlowTyping;
            delete window.__stopFlowTyping;
          } catch (e) {}
        };
      }, []);
      const a = stateFor(p);
      return html`<div class="animwrap" id="animwrap">
        <div class="frame">
          <div class="flowstage">
            <div class=${'flowlayer' + (a === 0 ? ' on' : '')}><${ScreenConnect} /></div>
            <div class=${'flowlayer flowlayer--center' + (a === 1 ? ' on' : '')}><${ScreenConnecting} /></div>
            <div class=${'flowlayer flowlayer--center' + (a === 2 ? ' on' : '')}><${ScreenConnected} /></div>
          </div>
          <div class="flowdots">${[0, 1, 2].map(i => html`<span key=${i} class=${'flowdot' + (a === i ? ' on' : '')}></span>`)}</div>
        </div>
        <div class="cursor" id="cursor"><svg width="26" height="32" viewBox="0 0 26 32">
          <path d="M4.5 2.2 4.5 24.4 10.4 18.9 14 27.6 18.4 25.7 14.9 17.2 22.4 16.6Z" fill="#fff" stroke="#14152b" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);

    /* ==========================================================================
       AUTO-PLAY with a scripted cursor — types each real field, presses the real
       button, then connecting → connected, looping. Enabled by ?auto.
       ========================================================================== */
    const AUTO = new URLSearchParams(location.search).has('auto');
    if (AUTO) {
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const setFlow = (v) => window.__setFlow && window.__setFlow(v);
      const waitFor = async (fn, t = 4000) => { const t0 = Date.now(); for (;;) { const v = fn(); if (v) return v; if (Date.now() - t0 > t) return null; await sleep(60); } };

      const wrap = () => document.getElementById('animwrap');
      const cursor = () => document.getElementById('cursor');
      let CX = 300, CY = 720;

      function moveCursor(x, y, dur) {
        const dist = Math.hypot(x - CX, y - CY);
        const d = dur || Math.max(240, Math.min(720, 240 + dist * 0.8));
        const c = cursor(); c.classList.add('show');
        c.style.transitionDuration = d + 'ms';
        c.style.transform = `translate(${x}px,${y}px)`;
        CX = x; CY = y; return sleep(d + 40);
      }
      function centerOf(node) {
        const r = node.getBoundingClientRect(), w = wrap().getBoundingClientRect();
        return { x: r.left - w.left + r.width / 2, y: r.top - w.top + r.height / 2 };
      }
      function ping(x, y) { const el = document.createElement('i'); el.className = 'cping'; el.style.left = x + 'px'; el.style.top = y + 'px'; wrap().appendChild(el); setTimeout(() => el.remove(), 600); }
      async function press() { const c = cursor(); c.classList.add('down'); ping(CX + 3, CY + 3); await sleep(120); c.classList.remove('down'); await sleep(90); }
      async function moveTo(node, dur) { if (!node) return; const c = centerOf(node); await moveCursor(c.x, c.y, dur); }
      async function typeInto(input, text, per = 26) {
        try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
        input.value = ''; input.dispatchEvent(new Event('input', { bubbles: true }));
        for (const ch of text) { input.value += ch; input.dispatchEvent(new Event('input', { bubbles: true })); await sleep(per + Math.random() * 22); }
      }

      const VALUES = ['Housecall Pro — Production', 'hcp_9f3a-b21c-4d9e-a077', 'sk_live_9f2c7a41d0b8e6a3'];

      async function run() {
        for (;;) {
          setFlow(0);
          cursor().classList.remove('show');
          CX = 300; CY = 720; cursor().style.transitionDuration = '0ms'; cursor().style.transform = 'translate(300px,720px)';
          await sleep(450);

          const inputs = await waitFor(() => { const n = document.querySelectorAll('.card2 input'); return n.length >= 3 ? n : null; });
          if (!inputs) { await sleep(1200); continue; }
          for (let i = 0; i < 3; i++) {
            await moveTo(inputs[i], 380); await press();
            await typeInto(inputs[i], VALUES[i]);
            await sleep(140);
          }
          await sleep(180);

          const btn = await waitFor(() => [...document.querySelectorAll('button')].find(b => (b.textContent || '').trim().startsWith('Test and Continue')));
          await moveTo(btn, 400); await press();
          cursor().classList.remove('show');
          setFlow(0.5);                 // connecting (pulse)
          await sleep(1700);
          setFlow(1);                   // connected
          await sleep(2000);
        }
      }
      setTimeout(run, 500);
    }
  </script>
</body>
</html>
