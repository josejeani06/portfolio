<style>
/* ==========================================================================
   Everything below is stage dressing: the gradient shell, the animated title,
   the two cursors and the boundary layer. The UI itself is all DS components.
   ========================================================================== */
html,body{margin:0;padding:0}
body{
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:28px 24px 36px; background:#0f1024;
  font-family:var(--font-family-body);
}

.stage-wrap{width:100%; max-width:1280px; position:relative; aspect-ratio:16 / 9}
body.is-embed .stage-wrap{max-width:none}
.stage{
  position:absolute; top:0; left:0; width:1280px; height:720px;   /* 16:9 */
  transform-origin:top left; border-radius:24px; overflow:hidden;
  user-select:none; cursor:none;
  /* bg-gradient-default — purple-300 → #A5A3FE, straight from the DS colour style */
  background:linear-gradient(90deg, var(--purple-300, #5551FF) 0%, #A5A3FE 100%);
}
.stage::after{  /* barely-there depth so the card doesn't float on flat colour */
  content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(140% 100% at 50% 34%, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 46%,
             rgba(43,40,140,.20) 100%);
}

/* ---------- title ---------- */
.app{position:absolute; inset:0}
.fx{position:absolute; inset:0; z-index:90; pointer-events:none}

.title-band{position:absolute; inset:0 0 auto 0; height:104px; z-index:4;
  display:grid; place-items:center; padding:0 72px; text-align:center}
.title-layer{grid-area:1/1; width:100%}
.title-layer h2{margin:0; color:#fff; font-weight:700; font-size:38px; line-height:1.08;
  letter-spacing:-.6px; text-shadow:0 4px 22px rgba(41,37,130,.38)}
.title-layer .w{display:inline-block; margin-right:.16em; opacity:0}
.title-layer.is-in .w{animation:wordIn .74s cubic-bezier(.19,.9,.24,1) both}
.title-layer.is-out{animation:titleOut .44s cubic-bezier(.4,0,.9,.3) both}
@keyframes wordIn{
  from{opacity:0; transform:translateY(28px) rotate(1.6deg); filter:blur(7px)}
  to  {opacity:1; transform:none; filter:blur(0)}
}
@keyframes titleOut{
  from{opacity:1; transform:none; filter:blur(0)}
  to  {opacity:0; transform:translateY(-18px); filter:blur(6px)}
}

/* ---------- map card shell ---------- */
.card{
  position:absolute; left:32px; top:104px; width:1216px; height:584px;
  border-radius:20px; overflow:hidden; z-index:2;
  box-shadow:0 34px 80px rgba(38,34,120,.42), 0 2px 6px rgba(38,34,120,.20);
  opacity:0; transform:translateY(20px) scale(.985);
  transition:opacity .8s cubic-bezier(.2,.8,.25,1), transform .8s cubic-bezier(.2,.8,.25,1);
}
.card.is-on{opacity:1; transform:none}
.card__surface{position:absolute; inset:0; transition:opacity .28s ease, filter .28s ease}
.card__surface.is-zooming{opacity:.5; filter:blur(2px)}

/* boundary layer: idle outlines only — anything selected becomes a real shape */
.boundary{position:absolute; inset:0; width:100%; height:100%; overflow:visible;
  z-index:12; pointer-events:none; opacity:0; transition:opacity .5s ease}
.boundary.is-on{opacity:1; animation:boundaryIn .55s cubic-bezier(.2,.85,.25,1) both}
@keyframes boundaryIn{from{opacity:0; transform:scale(1.012)} to{opacity:1; transform:none}}

/* the drawn shapes (radius / polygon / selected boundary) */
.shapes{position:absolute; inset:0; width:100%; height:100%; z-index:8; overflow:visible}

/* ---------- search dock: centred as a block, so the field rises when the
     results open ---------- */
.dock{position:absolute; left:50%; top:50%; width:43%;      /* settled width */
  transform:translate(-50%,-50%) scale(1.44);                 /* ≈62% of the stage at rest */
  z-index:6; display:grid; gap:16px; justify-items:stretch; transform-origin:center;
  transition:opacity .5s ease, transform .55s cubic-bezier(.2,.85,.25,1)}
/* once results are out the field settles back to 1x, and field + list are
   centred together as one block */
.dock.is-compact{transform:translate(-50%,-50%) scale(1)}
.dock.is-gone{opacity:0; transform:translate(-50%,-50%) scale(.96); pointer-events:none}
.dock__label{margin:0 0 2px; color:#fff; font-weight:700; font-size:26px; line-height:1.2;
  letter-spacing:-.3px; text-align:left; text-shadow:0 3px 16px rgba(41,37,130,.4)}
.dock__results{display:none}                     /* no height until it opens */
.dock__results.is-on{display:block; animation:resultsIn .32s cubic-bezier(.2,.85,.25,1) both}
@keyframes resultsIn{from{opacity:0; transform:translateY(-12px)} to{opacity:1; transform:none}}

/* the area menu sits on the card's bottom edge, so its panel opens upward */
.area-pop{position:absolute; right:0; bottom:calc(100% + 10px); z-index:40;
  animation:areaPop .22s cubic-bezier(.2,.85,.25,1) both}
@keyframes areaPop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ---------- overlays ---------- */
.scrim{position:absolute; inset:0; z-index:40; display:grid; place-items:center;
  background:rgba(26,23,92,.46); opacity:0; pointer-events:none; transition:opacity .3s ease}
.scrim.is-on{opacity:1; pointer-events:auto}
.scrim > *{transform:translateY(14px) scale(.97); transition:transform .3s cubic-bezier(.2,.8,.25,1)}
.scrim.is-on > *{transform:none}
.toast-slot{position:absolute; right:56px; top:150px; z-index:60;
  opacity:0; transform:translateY(-12px); transition:opacity .3s ease, transform .3s ease}
.toast-slot.is-on{opacity:1; transform:none}

/* ---------- cursors ---------- */
.cursor{position:absolute; left:0; top:0; z-index:90; width:28px; height:34px;
  pointer-events:none; transform:translate(300px,700px);
  transition:transform .6s cubic-bezier(.35,.02,.2,1), opacity .3s ease; will-change:transform}
.cursor.is-hidden{opacity:0}
.cursor svg{display:block; filter:drop-shadow(0 4px 8px rgba(5,5,22,.55)); transition:transform .1s ease}
.cursor.is-down svg{transform:scale(.84)}
.ping{position:absolute; z-index:88; width:28px; height:28px; margin:-14px 0 0 -14px;
  border-radius:9999px; border:2px solid rgba(255,255,255,.9); pointer-events:none;
  animation:ping .5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes ping{from{transform:scale(.3); opacity:.95} to{transform:scale(1.6); opacity:0}}

/* ---------- playback ---------- */
/* embedded as a thumbnail: no page chrome, no playback controls */
html.is-embed, body.is-embed{height:100%; overflow:hidden}
body.is-embed{padding:0; background:transparent; display:block}
body.is-embed .controls{display:none}
body.is-embed .stage-wrap{max-width:none; height:100%; aspect-ratio:auto}
body.is-embed .stage,body.is-embed .stage-wrap,body.is-embed .card{border-radius:0}

.controls{display:flex; align-items:center; gap:14px; margin-top:18px}
.dots{display:flex; gap:7px}
.dot{width:8px; height:8px; border-radius:9999px; background:rgba(255,255,255,.22); transition:all .3s ease}
.dot.is-on{background:#fff; width:24px}
.replay{display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 14px;
  border:1px solid rgba(255,255,255,.18); border-radius:9px; background:rgba(255,255,255,.06);
  color:#fff; font:var(--text-label); cursor:pointer}
.replay:hover{background:rgba(255,255,255,.12)}
</style>

/* ==========================================================================
   SLIPPY-MAP MATHS — the same projection MapSurface uses, so anything we draw
   stays pinned to real geography as the view moves.
   ========================================================================== */
const TILE = 256;
const lngToX = (lng, z) => ((lng + 180) / 360) * 2 ** z;
const latToY = (lat, z) => {
  const r = (lat * Math.PI) / 180;
  return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 2 ** z;
};
const xToLng = (x, z) => (x / 2 ** z) * 360 - 180;
const yToLat = (y, z) => {
  const n = Math.PI - (2 * Math.PI * y) / 2 ** z;
  return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
};
const project = (lat, lng, v) => ({
  x: CARD.w / 2 + (lngToX(lng, v.zoom) - lngToX(v.lng, v.zoom)) * TILE,
  y: CARD.h / 2 + (latToY(lat, v.zoom) - latToY(v.lat, v.zoom)) * TILE
});
const metresPerPixel = (lat, z) => (156543.03392 * Math.cos((lat * Math.PI) / 180)) / 2 ** z;

/* The real boundaries and shapes wear the package's own MapBoundary tones —
   MapBoundary itself is a fixed 300×220 spec tile with its own MapSurface, so
   it can't be laid over a live map; its TONE table is what carries over.
     default  neutral, dashed, low fill   — a boundary you haven't chosen
     hover    brand emphasised
     include  INFO blue, solid, tinted    — in the audience
     exclude  ERROR red, dashed, tinted   — cut out
   (values copied from MapBoundary.jsx / _mapShapeTone.js) */
const BOUNDARY_TONE = {
  default: { stroke:"var(--neutral-text-icon-strong)", fill:"var(--neutral-bg-strong)", dash:"9 6", w:3.5, fillOpacity:.20 },
  hover:   { stroke:"var(--brand-bg-default)",         fill:"var(--brand-bg-default)",  dash:"9 6", w:4,   fillOpacity:.32 },
  include: { stroke:"var(--info-bg-default)",       fill:"var(--info-bg-default)",   dash:null,  w:3,   fillOpacity:.16 },
  exclude: { stroke:"var(--error-bg-default)",      fill:"var(--error-bg-default)",  dash:"6 4", w:3,   fillOpacity:.16 }
};
const TONE = {
  include: { stroke:BOUNDARY_TONE.include.stroke, dash:null,  fill:.20 },
  exclude: { stroke:BOUNDARY_TONE.exclude.stroke, dash:"6 4", fill:.24 },
  pending: { stroke:BOUNDARY_TONE.hover.stroke,   dash:null,  fill:.32 }
};

const AREA_LEVELS = [
  { value:"usa",    label:"USA"      },
  { value:"state",  label:"State"    },
  { value:"county", label:"County"   },
  { value:"city",   label:"City"     },
  { value:"zip",    label:"ZIP Code" }
];

const parseRing = s => s.split(" ").map(p => { const [x, y] = p.split(","); return [+y, +x]; });
const COUNTY_RINGS = GEO_COUNTIES.map(c => ({ name:c.n, rings:c.r.map(parseRing) }));
const ZIP_RINGS    = GEO_ZIPS.map(z => ({ zip:z.z, structures:z.s, ring:parseRing(z.c) }));

function App(){

  const [shapes, setShapes]   = useState([]);         // geo-anchored, DS tones
  const [sel, setSel]         = useState(null);
  const [layer, setLayer]     = useState(null);       // 'county' | 'zip' | null
  const [hoverKey, setHoverKey] = useState(null);     // the boundary under the cursor
  const [hoverName, setHoverName] = useState("");     // …and what it's called
  const [area, setArea]       = useState(null);
  const [areaOpen, setAreaOpen] = useState(false);
  const [dialog, setDialog]   = useState(null);       // 'save' | null
  const [mapName, setMapName] = useState("");
  const [toast, setToast]     = useState(null);

  const canvasRef = useRef(null);

  /* the script talks to the app through this */
  api = {
    setView, setZooming, setCardOn, setDock, setQuery, setRes, setMode, setDraft,
    setShapes, setSel, setLayer, setHoverKey, setHoverName, setArea, setAreaOpen, setDialog, setMapName, setToast, setCompact,
    get shapes(){ return shapes; },
    get view(){ return view; },
    canvas: () => canvasRef.current
  };

  const p = (lat, lng) => project(lat, lng, view);
  const selShape = shapes.find(s => s.id === sel) || null;

  /* ---- idle boundary outlines ----
     Every unchosen boundary is a click target, so it has to LOOK like one: the
     DS default tone (neutral, dashed, low fill) over a white halo, because a
     mid-grey dash alone disappears into street detail. The boundary under the
     cursor lifts to the DS hover tone. */
  const boundary = [];
  /* Line weight scales with density: a handful of big counties can carry the
     full default tone, but 135 adjacent ZIPs at that weight bury the map, so
     the grid draws thin. The hovered cell always gets the full hover tone. */
  const drawBoundary = (key, ring, { fill = false, dense = false } = {}) => {
    const on = hoverKey === key;
    const t  = BOUNDARY_TONE[on ? "hover" : "default"];
    const w  = dense && !on ? 1.1 : t.w;
    const halo = dense && !on ? 1.6 : 4;
    const dash = dense && !on ? "5 4" : t.dash;
    const pts = ring.map(([la, ln]) => { const q = p(la, ln); return `${q.x},${q.y}`; }).join(" ");
    boundary.push(html`<polygon key=${key + "-halo"} points=${pts}
      fill="none" stroke="rgba(255,255,255,.9)" stroke-width=${w + halo} stroke-linejoin="round" />`);
    boundary.push(html`<polygon key=${key} points=${pts}
      fill=${fill || on ? t.fill : "none"}
      fill-opacity=${fill || on ? t.fillOpacity : 0}
      stroke=${t.stroke} stroke-width=${w} stroke-dasharray=${dash}
      stroke-linejoin="round" opacity=${dense && !on ? .7 : 1} />`);
  };

  if(layer === "county"){
    COUNTY_RINGS.forEach((c, i) => c.rings.forEach((ring, j) =>
      drawBoundary(`c${i}-${j}`, ring, { fill:true })));
  }
  if(layer === "zip"){
    ZIP_RINGS.forEach(z => drawBoundary(`z${z.zip}`, z.ring, { dense:true }));
  }

  /* the hovered boundary names itself, the way MapBoundary's chip does */
  const chips = [];
  const chipStyle = colour => ({ position:"absolute", transform:"translate(-50%,-50%)",
    background:"var(--neutral-bg-default)", padding:"3px 9px", borderRadius:9999,
    font:"var(--text-caption)", color:colour, boxShadow:"var(--shadow-sm)",
    whiteSpace:"nowrap", pointerEvents:"none", zIndex:16 });

  if(hoverKey && hoverName){
    const ring = hoverKey.startsWith("z")
      ? (ZIP_RINGS.find(z => `z${z.zip}` === hoverKey) || {}).ring
      : (() => { const [ci, ri] = hoverKey.slice(1).split("-").map(Number);
                 return COUNTY_RINGS[ci] && COUNTY_RINGS[ci].rings[ri]; })();
    if(ring){
      const qs = ring.map(([la, ln]) => p(la, ln));
      chips.push(html`<span key="hoverchip" style=${{ ...chipStyle("var(--brand-text-icon-default)"),
        left:qs.reduce((a, q) => a + q.x, 0) / qs.length,
        top:qs.reduce((a, q) => a + q.y, 0) / qs.length }}>${hoverName}</span>`);
    }
  }
  /* an area that has been decided says so, in the tone's own word */
  shapes.filter(s => s.typeLabel).forEach(s => {
    const qs = s.points.map(([la, ln]) => p(la, ln));
    chips.push(html`<span key=${`chip-${s.id}`} style=${{
      ...chipStyle(s.mode === "exclude" ? "var(--error-text-icon-default)"
                 : s.mode === "pending" ? "var(--brand-text-icon-default)"
                 : "var(--info-text-icon-default)"),
      left:qs.reduce((a, q) => a + q.x, 0) / qs.length,
      top:qs.reduce((a, q) => a + q.y, 0) / qs.length }}>
      ${s.mode === "exclude" ? "Excluded" : s.mode === "pending" ? "Selected" : "Included"} · ${s.address}</span>`);
  });

  /* ---- drawn shapes ---- */
  const shapeEls = shapes.map(s => {
    const t = TONE[s.mode] || TONE.pending;
    const on = s.id === sel;
    const common = {
      fill:t.stroke, "fill-opacity":on ? t.fill + .08 : t.fill,
      stroke:t.stroke, "stroke-width":on ? 4 : 3,

      style:{ cursor:"pointer", transition:"fill-opacity .2s ease" },

const stage = document.getElementById("stage");
const fx    = document.getElementById("fx");
ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));

/* ==========================================================================
   STAGE SCALING
   ========================================================================== */
const stageWrap = document.getElementById("stageWrap");
let SCALE = 1;
function fitStage(){
  /* Authored at 1280×720 (16:9) and scaled to the container on both axes, up as
     well as down. Embedded it COVERS — the frame must reach every edge with no
     whitespace — while standalone it CONTAINS so nothing is ever cropped. */
  const w = stageWrap.clientWidth;
  const h = stageWrap.clientHeight || (w * STAGE_H / STAGE_W);
  SCALE = EMBED ? Math.max(w / STAGE_W, h / STAGE_H)
                : Math.min(w / STAGE_W, h / STAGE_H);
  stage.style.transform = `scale(${SCALE})`;
  stage.style.left = ((w - STAGE_W * SCALE) / 2) + "px";
  stage.style.top  = ((h - STAGE_H * SCALE) / 2) + "px";
}
window.addEventListener("resize", fitStage);
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(stageWrap);
fitStage();

/* ==========================================================================
   ANIMATION ENGINE
   ========================================================================== */
/* Bumping EPOCH aborts any scene mid-flight: every pending sleep rejects with
   STOP, which unwinds the whole await chain at once. That's what lets a hover
   preview stop cleanly instead of finishing its scene first. */
let EPOCH = 0;
const STOP = { stop:true };
const sleep = ms => new Promise((res, rej) => {
  const e = EPOCH;
  setTimeout(() => (e === EPOCH ? res() : rej(STOP)), ms / CONFIG.speed);
});
/* rAF alone stalls whenever the page is backgrounded or the tab is throttled,
   which would freeze a tween mid-flight. Race it against a timer so the
   timeline always keeps moving. */
const raf = () => new Promise(resolve => {
  let done = false;
  const fire = () => { if(!done){ done = true; resolve(); } };
  requestAnimationFrame(fire);
  setTimeout(fire, 32);
});
const easeOut   = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

async function tween(from, to, dur, fn, ease = easeOut){
  const d = dur / CONFIG.speed, t0 = performance.now(), e = EPOCH;
  for(;;){
    if(e !== EPOCH) throw STOP;
    const p = Math.min(1, (performance.now() - t0) / d);
    fn(from + (to - from) * ease(p), p);
    if(p === 1) return;
    await raf();
  }
}

/* two cursors */
function makeCursor(cls, fill, home){
  const el = document.createElement("div");
  el.className = `cursor ${cls} is-hidden`;
  el.innerHTML = `<svg width="28" height="34" viewBox="0 0 28 34">
    <path d="M5 2.4 5 25.6 11.2 19.8 15 29 19.6 27 15.9 18 23.8 17.6Z"
      fill="${fill}" stroke="#14152b" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  fx.appendChild(el);
  const c = {
    el, x:home[0], y:home[1], home,
    show(){ el.classList.remove("is-hidden"); },
    hide(){ el.classList.add("is-hidden"); },
    jump(x, y){ el.style.transitionDuration = "0ms"; el.style.transform = `translate(${x}px,${y}px)`; c.x = x; c.y = y; },
    move(x, y, dur = 640){
      const dist = Math.hypot(x - c.x, y - c.y);
      const d = Math.max(200, Math.min(dur, 200 + dist * .85));
      el.style.transitionDuration = (d / CONFIG.speed) + "ms";
      el.style.transform = `translate(${x}px,${y}px)`;
      c.x = x; c.y = y;
      return sleep(d + 40);
    },
    async press(){
      el.classList.add("is-down");
      const ping = document.createElement("i");
      ping.className = "ping";
      ping.style.left = (c.x + 4) + "px";
      ping.style.top  = (c.y + 4) + "px";
      fx.appendChild(ping);
      setTimeout(() => ping.remove(), 700);
      await sleep(130);
      el.classList.remove("is-down");
      await sleep(100);
    }
  };
  c.jump(home[0], home[1]);
  return c;
}
const A = makeCursor("cursor--a", "#ffffff", [300, 700]);
const B = makeCursor("cursor--b", "#dce8ff", [1120, 660]);

/* stage-space helpers */
function centerOf(node){
  const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x:(r.left - s.left + r.width / 2) / SCALE, y:(r.top - s.top + r.height / 2) / SCALE };
}
const cardPt = q => ({ x:q.x + CARD.x, y:q.y + CARD.y });
const geoPt  = (lat, lng) => cardPt(project(lat, lng, api.view));

/* Material Symbols render their ligature NAME as text ("my_location",
   "expand_more"), so a DS button's textContent is "my_locationAdd Radius".
   labelOf() reads only the human label by skipping icon spans. */
function labelOf(node){
  let out = "";
  (function walk(n){
    if(n.nodeType === 3){ out += n.nodeValue; return; }
    if(n.nodeType !== 1) return;
    if(n.tagName === "STYLE" || n.tagName === "SCRIPT") return;   // DS Button ships its spinner keyframes inline
    const cls = typeof n.className === "string" ? n.className : (n.className && n.className.baseVal) || "";
    let ff = (n.style && n.style.fontFamily) || "";
    if(!/material symbols/i.test(ff)){
      try { ff += " " + (getComputedStyle(n).fontFamily || ""); } catch(_){}
    }
    if(/material symbols/i.test(ff) || /material-symbols/i.test(cls)) return;   // icon ligature, not a label
    n.childNodes.forEach(walk);
  })(node);
  return out.replace(/\s+/g, " ").trim().toLowerCase();
}

/* Find a DS control by its visible label. Only ever matches something
   clickable, and never the animated title — the headline contains words like
   "County" and "Exclude" too. */
function byText(text, root = document.getElementById("app")){
  const wanted = text.trim().toLowerCase();
  const nodes = root.querySelectorAll("button,[role='option'],[role='button']");
  for(const n of nodes){
    if(n.closest(".title-band")) continue;
    if(labelOf(n) === wanted) return n;
  }
  return null;
}
/* the open listbox of a DS SelectButton / MapOptions */
const openList = scope => {
  const root = scope ? document.querySelector(scope) : document.getElementById("app");
  return root && root.querySelector("[role='listbox']");
};
function optionIn(scope, label){
  const list = openList(scope);
  if(!list) return null;
  return [...list.querySelectorAll("[role='option']")]
    .find(o => labelOf(o).startsWith(label.toLowerCase())) || null;
}
/* the area picker's trigger — SelectButton relabels itself once a value is
   chosen ("County"), so it is found by its container, not by its text */
const areaTrigger = () => document.querySelector(".area-select button");
/* a row of the DS SelectAreaDropdown panel */
/* a result row of the search DropdownList — its label is followed by a badge
   ("City", "County"), so rows match on prefix rather than exact text */
const resultRow = label => {
  const list = document.getElementById("dockResults");
  if(!list) return null;
  return [...list.querySelectorAll("[role='option']")]
    .find(o => labelOf(o).startsWith(label.toLowerCase())) || null;
};
const areaRow = label => {
  const pop = document.querySelector(".area-pop");
  if(!pop) return null;
  return [...pop.querySelectorAll("[role='option']")]
    .find(o => labelOf(o).startsWith(label.toLowerCase())) || null;
};

/* a button inside the BubbleBox — never the headline */
function bubbleBtn(label){
  const box = document.getElementById("bubbleAnchor");
  if(!box) return null;
  return [...box.querySelectorAll("button")]
    .find(b => labelOf(b) === label.toLowerCase()) || null;
}
async function waitFor(fn, timeout = 4000){
  const t0 = performance.now();
  for(;;){
    const v = fn();
    if(v) return v;
    if(performance.now() - t0 > timeout) return null;
    await sleep(60);
  }
}

/* a scripted click that fires the component's own handler */
function realClick(node){
  const r = node.getBoundingClientRect();
  const opts = { bubbles:true, cancelable:true, view:window,
    clientX:r.left + r.width / 2, clientY:r.top + r.height / 2 };
  node.dispatchEvent(new MouseEvent("pointerdown", opts));
  node.dispatchEvent(new MouseEvent("mousedown", opts));
  node.dispatchEvent(new MouseEvent("mouseup", opts));
  node.dispatchEvent(new MouseEvent("click", opts));
}
/* DS components track hover in React state, so the scripted cursor sends the
   real enter/leave pairs — pointer AND mouse, since components differ. */
function hoverOn(node){
  ["pointerover", "pointerenter", "mouseover", "mouseenter"].forEach(t =>
    node.dispatchEvent(new MouseEvent(t, { bubbles:t.endsWith("over"), cancelable:true, view:window })));
}
function hoverOff(node){
  ["pointerout", "pointerleave", "mouseout", "mouseleave"].forEach(t =>
    node.dispatchEvent(new MouseEvent(t, { bubbles:t.endsWith("out"), cancelable:true, view:window })));
}
async function hover(cur, node, hold = 460){
  if(!node){ window.__errs.push("no hover target @" + ((new Error().stack || "").split("\n")[2] || "").trim()); return; }
  const c = centerOf(node);
  await cur.move(c.x, c.y);
  hoverOn(node);
  await sleep(hold);
  hoverOff(node);
}

async function click(cur, node, { hold = 260, after = 180 } = {}){
  if(!node){
    const list = document.querySelector(".area-select [role='listbox']");
    const box  = document.getElementById("bubbleAnchor");
    window.__errs.push("no click target @" + ((new Error().stack || "").split("\n")[2] || "").trim()
      + " | areaOpts=" + (list ? [...list.querySelectorAll("[role='option']")].map(labelOf).join(",") : "closed")
      + " | bubbleBtns=" + (box ? [...box.querySelectorAll("button")].map(labelOf).join(",") : "none"));
    return;
  }
  const c = centerOf(node);
  await cur.move(c.x, c.y);
  hoverOn(node);
  await sleep(hold);
  await cur.press();
  realClick(node);
  await sleep(after);
  hoverOff(node);
}
async function clickText(cur, text, opts){
  const node = await waitFor(() => byText(text));
  await click(cur, node, opts);
}
/* click the live map at a real lat/lng */
async function clickGeo(cur, lat, lng, hold = 0){
  const q = geoPt(lat, lng);
  await cur.move(q.x, q.y);
  if(hold) await sleep(hold);
  await cur.press();
}

/* typing into a DS field */
async function typeInto(setter, text, per = 58){
  for(let i = 1; i <= text.length; i++){
    setter(text.slice(0, i));
    await sleep(per + Math.random() * 38);
  }
}

/* view moves: pan smoothly, step the zoom under a short dip */
async function flyTo(target, dur = 1900){
  const from = api.view;
  if(from.zoom !== target.zoom) api.setZooming(true);
  let stepped = false;
  await tween(0, 1, dur, t => {
    const lat = from.lat + (target.lat - from.lat) * t;
    const lng = from.lng + (target.lng - from.lng) * t;
    if(!stepped && t > .42 && from.zoom !== target.zoom){
      stepped = true;
      api.setView({ lat, lng, zoom:target.zoom });
      setTimeout(() => api.setZooming(false), 260 / CONFIG.speed);
    } else {
      api.setView(v => ({ ...v, lat, lng }));
    }
  }, easeInOut);
  api.setView(target);
  api.setZooming(false);
  await sleep(160);
}

/* ==========================================================================
   TITLE
   ========================================================================== */
let currentTitle = null;
function setTitle(text){
  const band = document.getElementById("titleBand");
  if(!band) return sleep(0);
  const layer = document.createElement("div");
  layer.className = "title-layer";
  const h = document.createElement("h2");
  const words = text.split(" ");
  words.forEach((w, i) => {
    const s = document.createElement("span");
    s.className = "w";
    s.textContent = w;
    s.style.animationDelay = (i * 55 / CONFIG.speed) + "ms";
    h.appendChild(s);
  });
  layer.appendChild(h);
  band.appendChild(layer);
  void layer.offsetWidth;
  layer.classList.add("is-in");
  if(currentTitle){
    const old = currentTitle;
    old.classList.add("is-out");
    setTimeout(() => old.remove(), 620 / CONFIG.speed);
  }
  currentTitle = layer;
  return sleep(420 + words.length * 55);
}

async function sceneSearch(){

  A.jump(...A.home); A.show();
  await sleep(320);

  const field = document.querySelector("#dock input");
  await click(A, field, { hold:160, after:80 });

  await sleep(180);

  await typeInto(api.setQuery, CONFIG.query);
  api.setCompact(true);                 // typing done → the field settles smaller
  await sleep(180);
  api.setRes(true);
  await sleep(520);

  /* run down a couple of results so the hover state actually reads */
  await hover(A, await waitFor(() => resultRow("Los Angeles California")), 420);
  await hover(A, await waitFor(() => resultRow("Los Angeles County CA")), 380);
  await click(A, await waitFor(() => resultRow("Los Angeles CA")), { hold:420 });

  api.setRes(false);
  api.setDock(true);                    // the field leaves the moment a result is picked
  api.setCardOn(true);
  await sleep(260);
  await flyTo(CONFIG.views.city, 1700);
}

async function sceneDraw(){
  markScene(1);
  setTitle(CONFIG.titles.radius);      // title reveals while the first shape is already going down

  /* No draw-mode banner here: the point of the scene is the shapes, so the
     cursors just draw. A drops a centre and drags the handle out while B
     places the polygon's seven points and closes it — genuinely at once. */
  A.show();
  await clickGeo(A, CONFIG.radius.lat, CONFIG.radius.lng, 120);
  api.setShapes([{ id:"rad-1", kind:"radius", mode:"include",
    lat:CONFIG.radius.lat, lng:CONFIG.radius.lng, metres:CONFIG.radius.from,
    address:"Fullerton, Orange County", structures:"46,800" }]);
  await sleep(240);

  const jobA = (async () => {
    const handleAt = m => {
      const c = geoPt(CONFIG.radius.lat, CONFIG.radius.lng);
      return { x:c.x + m / metresPerPixel(CONFIG.radius.lat, api.view.zoom), y:c.y };
    };
    const start = handleAt(CONFIG.radius.from);
    await A.move(start.x, start.y, 520);
    A.el.classList.add("is-down");                 // pointer held down for the drag
    await tween(CONFIG.radius.from, CONFIG.radius.to, 2200, m => {
      api.setShapes(xs => xs.map(s => s.id === "rad-1" ? { ...s, metres:m } : s));
      const q = handleAt(m);
      A.jump(q.x, q.y);
    });
    A.el.classList.remove("is-down");
    await sleep(220);
  })();

  const jobB = (async () => {
    B.jump(...B.home);
    B.show();
    await sleep(160);

    const { lat, lng } = CONFIG.polygon;
    const pts = [
      { a:-74, r:.055 }, { a:-6, r:.039 }, { a:47, r:.061 }, { a:106, r:.032 },
      { a:154, r:.057 }, { a:207, r:.030 }, { a:263, r:.048 }
    ].map(({ a, r }) => {
      const rad = a * Math.PI / 180;
      return [ lat + r * Math.sin(rad) * .78, lng + r * Math.cos(rad) * 1.3 ];
    });

    for(const [la, ln] of pts){
      await clickGeo(B, la, ln);
      api.setDraft(d => [...d, [la, ln]]);
      await sleep(90);
    }
    /* close the shape on the first point, the way the real editor does */
    await clickGeo(B, pts[0][0], pts[0][1], 120);
    api.setShapes(xs => [...xs, { id:"poly-1", kind:"polygon", mode:"include",
      points:pts, address:"Irvine, Orange County", structures:"18,400" }]);
    api.setDraft([]);
    await sleep(320);
    B.hide();
  })();

  await Promise.all([jobA, jobB]);
  await sleep(260);
}

async function sceneCounty(){
  markScene(2);
  await setTitle(CONFIG.titles.area);

  await click(A, areaTrigger(), { after:620 });          // the menu stays open long enough to read
  await waitFor(() => document.querySelector(".area-pop"));
  await hover(A, await waitFor(() => areaRow("ZIP")), 620);       // glance down the list…
  await click(A, await waitFor(() => areaRow("County")), { hold:420, after:320 });

  await flyTo(CONFIG.views.county, 1600);
  api.setLayer("county");                 // all county boundaries first…
  await sleep(700);                       // …and a beat to take them in

  /* sweep the cursor over a few counties first — the hover tone is what says
     "these are the things you can click" */
  const laIdx = COUNTY_RINGS.findIndex(c => c.name === CONFIG.countyName);
  const la = COUNTY_RINGS[laIdx];
  for(const [name, lat, lng] of [
    ["San Bernardino County", 34.60, -116.90],
    ["Ventura County",        34.45, -119.10],
    ["Orange County",         33.70, -117.80]
  ]){
    const i = COUNTY_RINGS.findIndex(c => c.name === name);
    if(i < 0) continue;
    api.setHoverKey(`c${i}-0`); api.setHoverName(name);
    const q = geoPt(lat, lng);
    await A.move(q.x, q.y);
    await sleep(420);
  }
  api.setHoverKey(`c${laIdx}-0`); api.setHoverName(CONFIG.countyName);
  await clickGeo(A, 34.35, -118.15, 620);
  api.setShapes(xs => [...xs, { id:"county-1", kind:"polygon", mode:"pending",
    points:la.rings[0], typeLabel:"County", address:CONFIG.countyName,
    meta:"California", structures:CONFIG.countyStructures }]);
  api.setSel("county-1");
  api.setHoverKey(null); api.setHoverName("");   // the shape carries the state now
  await sleep(900);

  await click(A, await waitFor(() => bubbleBtn("Include")), { hold:340, after:280 });
  await sleep(850);
  api.setSel(null);
  await sleep(240);
}

async function sceneZip(){
  markScene(3);
  await setTitle(CONFIG.titles.zip);

  await click(A, areaTrigger(), { after:620 });
  await waitFor(() => document.querySelector(".area-pop"));
  await hover(A, await waitFor(() => areaRow("County")), 380);
  await click(A, await waitFor(() => areaRow("ZIP")), { hold:420, after:320 });

  await flyTo(CONFIG.views.metro, 1500);
  api.setLayer("zip");                    // every ZIP boundary first…
  await sleep(700);                       // …then pick one

  const centreOf = r => [ r.ring.reduce((a, q) => a + q[0], 0) / r.ring.length,
                          r.ring.reduce((a, q) => a + q[1], 0) / r.ring.length ];
  /* run across a few ZIPs so the grid reads as clickable, then settle on one */
  for(const code of ["90045", "90019", "90028"]){
    const r = ZIP_RINGS.find(x => x.zip === code);
    if(!r) continue;
    api.setHoverKey(`z${code}`); api.setHoverName(`ZIP ${code}`);
    const [la2, ln2] = centreOf(r);
    const q = geoPt(la2, ln2);
    await A.move(q.x, q.y);
    await sleep(380);
  }

  const z = ZIP_RINGS.find(r => r.zip === CONFIG.zipCode) || ZIP_RINGS[0];
  const [cLat, cLng] = centreOf(z);
  api.setHoverKey(`z${z.zip}`); api.setHoverName(`ZIP ${z.zip}`);
  await clickGeo(A, cLat, cLng, 620);
  api.setShapes(xs => [...xs, { id:"zip-1", kind:"polygon", mode:"pending",
    points:z.ring, typeLabel:"ZIP Code", address:z.zip,
    meta:"Los Angeles ZIP Code", structures:Math.round(z.structures * 4.2).toLocaleString("en-US") }]);
  api.setSel("zip-1");
  api.setHoverKey(null); api.setHoverName("");   // the shape carries the state now
  await sleep(880);

  await click(A, await waitFor(() => bubbleBtn("Exclude")), { hold:340, after:280 });
  await sleep(900);
  api.setSel(null);
  await sleep(240);
}

async function sceneSave(){
  markScene(4);
  await setTitle(CONFIG.titles.save);

  await clickText(A, "Map Options", { after:340 });
  await click(A, await waitFor(() => optionIn(null, "Save this Map")), { after:560 });

  const input = await waitFor(() => document.querySelector(".scrim.is-on input"));
  await click(A, input, { hold:180, after:80 });
  input?.focus();
  await sleep(160);
  await typeInto(api.setMapName, CONFIG.mapName, 50);
  await sleep(420);

  const save = await waitFor(() => {
    const scrim = document.getElementById("saveScrim");
    if(!scrim || !scrim.classList.contains("is-on")) return null;
    return [...scrim.querySelectorAll("button")].find(b => labelOf(b) === "save this map");
  });
  await click(A, save, { after:420 });
  await sleep(2400);
  api.setToast(null);
  await sleep(400);
}

/* ==========================================================================
   RESET + RUN
   ========================================================================== */
function resetAll(){
  api.setShapes([]); api.setDraft([]); api.setSel(null); api.setLayer(null); api.setHoverKey(null); api.setHoverName("");
  api.setArea(null); api.setMode(null); api.setDialog(null); api.setToast(null);
  api.setQuery(""); api.setRes(false); api.setDock(false); api.setCardOn(false);
  api.setCompact(false); api.setAreaOpen(false);
  api.setMapName("");
  api.setView(CONFIG.views.city);
  const band = document.getElementById("titleBand");
  if(band) band.innerHTML = "";
  currentTitle = null;
  A.jump(...A.home); B.jump(...B.home); A.hide(); B.hide();
  markScene(-1);
}

/* jump straight to a placed map, for previews that skip the search intro */
function enterAtDraw(){
  api.setDock(true);
  api.setCardOn(true);
  api.setQuery(CONFIG.query);
  api.setView(CONFIG.views.city);
}

async function play({ from = 0 } = {}){
  const me = ++EPOCH;                    // any older run aborts at its next await
  const alive = () => me === EPOCH;
  resetAll();
  if(from > 0) enterAtDraw();
  await sleep(from > 0 ? 320 : 500);
  try{
    if(from === 0){ await sceneSearch(); if(!alive()) return; }
    await sceneDraw();        if(!alive()) return;
    await sceneCounty();      if(!alive()) return;
    await sceneZip();         if(!alive()) return;
    await sceneSave();
  } catch(err){
    if(err === STOP) return;             // superseded by a newer run
    window.__errs.push("SCENE " + (err && err.stack || err));
    if(alive()) console.error("[animation]", err);
  }
  if(CONFIG.loop && alive()){ await sleep(1200); if(alive()) play({ from }); }
}

document.getElementById("replay").addEventListener("click", () => play());

/* ==========================================================================
   POSTER + EMBED — as a thumbnail the piece holds a still of the finished
   selection and only runs while the card is hovered.
   ========================================================================== */
function poster(){
  EPOCH++;                                   // stop anything in flight
  resetAll();
  api.setCardOn(true);
  api.setDock(true);
  api.setView(CONFIG.views.metro);
  api.setLayer("zip");

  const la = COUNTY_RINGS.find(c => c.name === CONFIG.countyName);
  const z  = ZIP_RINGS.find(r => r.zip === CONFIG.zipCode) || ZIP_RINGS[0];
  const poly = [
    { a:-74, r:.055 }, { a:-6, r:.039 }, { a:47, r:.061 }, { a:106, r:.032 },
    { a:154, r:.057 }, { a:207, r:.030 }, { a:263, r:.048 }
  ].map(({ a, r }) => {
    const rad = a * Math.PI / 180;
    return [ CONFIG.polygon.lat + r * Math.sin(rad) * .78,
             CONFIG.polygon.lng + r * Math.cos(rad) * 1.3 ];
  });

  api.setShapes([
    { id:"rad-1", kind:"radius", mode:"include", lat:CONFIG.radius.lat, lng:CONFIG.radius.lng,
      metres:CONFIG.radius.to, address:"Fullerton, Orange County", structures:"46,800" },
    { id:"poly-1", kind:"polygon", mode:"include", points:poly,
      address:"Irvine, Orange County", structures:"18,400" },
    { id:"county-1", kind:"polygon", mode:"include", points:la.rings[0], typeLabel:"County",
      address:CONFIG.countyName, meta:"California", structures:CONFIG.countyStructures },
    { id:"zip-1", kind:"polygon", mode:"exclude", points:z.ring, typeLabel:"ZIP Code",
      address:z.zip, meta:"Los Angeles ZIP Code",
      structures:Math.round(z.structures * 4.2).toLocaleString("en-US") }
  ]);
  api.setArea("zip");
  setTitle(CONFIG.titles.area);
}

if(EMBED){
  CONFIG.loop = false;                       // one pass per hover

  /* Two channels, because postMessage is blocked between file:// documents
     (opaque origins) even though it works fine once this is served: the host
     page can always navigate the frame's fragment. */
  /* the preview opens on the drawing — the search intro is the slowest beat
     and the shapes are what the thumbnail is selling.
     Reload-based (&play=1) is the reliable file:// channel; hash + message
     are kept for a served environment. */
  const wantPlay = new URLSearchParams(location.search).has("play");
  setTimeout(() => (wantPlay || location.hash === "#play" ? play({ from:1 }) : poster()), 700);
  window.addEventListener("hashchange", () => (location.hash === "#play" ? play({ from:1 }) : poster()));
  window.addEventListener("message", e => {
    if(e.data === "play") play({ from:1 });
    if(e.data === "stop") poster();
  });
} else {
  setTimeout(play, 900);
}
</script>
